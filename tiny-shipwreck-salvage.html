<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tiny Shipwreck Salvage</title>
<style>
:root{--ink:#0d2233;--paper:#f6e7c1;--paper2:#e6cf98;--brass:#f2b632;--teal:#2a9d9f}
html,body{margin:0;height:100%;background:#031421;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink);touch-action:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
img.ic{width:22px;height:22px;vertical-align:middle;flex:none}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 var(--ink);font-size:16px;font-weight:800}
.bar{width:90px;height:12px;background:#fff;border:2px solid var(--ink);border-radius:7px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--teal);width:100%}
.tools{margin-left:auto;display:flex;gap:8px;pointer-events:auto}
#warn{position:fixed;top:calc(60px + env(safe-area-inset-top));width:100%;text-align:center;font-weight:900;color:#ffb3a6;text-shadow:0 2px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .2s}
#hint{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
#hint>div{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;display:flex;gap:18px;align-items:center;pointer-events:auto;font-weight:800}
kbd{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:6px;font-weight:800;margin:2px;box-shadow:0 3px 0 var(--ink);font-family:inherit}
.tri{display:inline-block;width:0;height:0;border:6px solid transparent;vertical-align:middle}
button{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;background:var(--brass);color:var(--ink);box-shadow:0 4px 0 var(--ink)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:disabled{background:#bdb49c;color:#6b6555;border-color:#6b6555;box-shadow:0 4px 0 #6b6555;cursor:default}
button.pill{padding:3px 10px;background:var(--paper)}
button.pill.off{background:#c9c2ab}
#hint .skip{padding:3px 10px;font-size:13px;background:var(--paper2)}
body.touch .kb,body:not(.touch) .tp{display:none}
#shop{position:fixed;inset:0;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));box-sizing:border-box;text-align:center;display:none;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:repeating-linear-gradient(90deg,#0a3047 0 78px,#082a3e 78px 80px)}
.sign{display:inline-block;background:var(--brass);border:4px solid var(--ink);border-radius:10px;padding:6px 22px;font-size:26px;font-weight:900;letter-spacing:1px;text-transform:uppercase;box-shadow:0 5px 0 var(--ink);transform:rotate(-1deg)}
.purse{display:inline-flex;align-items:center;gap:8px;margin:18px 0 4px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 18px;box-shadow:0 4px 0 var(--ink);font-size:30px;font-weight:900}
.purse img.big{width:34px;height:34px}.purse small{font-size:15px;color:#2f7a55}
.note{display:inline-block;background:var(--paper2);border:3px dashed var(--ink);border-radius:10px;padding:6px 14px;margin:8px 0;font-weight:700}
.note.good{background:#bfe8a8}
.stats{color:#cfe6f2;margin:6px 0;font-weight:600}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
button.btn{font-size:19px;padding:11px 22px;min-width:250px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.btn img{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:920px;margin:0 auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;text-align:left;box-shadow:0 5px 0 var(--ink)}
.card:nth-child(odd){transform:rotate(-.5deg)}.card:nth-child(even){transform:rotate(.4deg)}
.card b{display:flex;gap:10px;align-items:center;font-size:16px}
.plate{display:flex;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px}
.plate img{width:34px;height:34px}
.card small{margin-left:auto;background:var(--ink);color:var(--paper);border-radius:8px;padding:1px 8px;font-size:13px}
.st{display:block;font-size:13px;margin-top:6px;font-weight:600;color:#3a4a56}
.card button{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.card button img{width:18px;height:18px}
.card button.sm{font-size:13px;padding:4px 8px;background:var(--paper2)}
.codes{display:flex;gap:8px;justify-content:center;align-items:center;margin:26px 0 4px;color:#cfe6f2;font-weight:700;flex-wrap:wrap}
input{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink);text-transform:uppercase;width:150px;-webkit-user-select:text;user-select:text}
#cmsg{min-height:22px;font-weight:700;color:#ffb3a6}#cmsg.good{color:#8dff9f}
#adov{position:fixed;inset:0;background:#000c;display:none;opacity:0;animation:adshow .2s .2s forwards;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9;font-weight:700;color:#fff}
#adov i{width:38px;height:38px;border:5px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes adshow{to{opacity:1}}
#legal{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 20px);box-sizing:border-box;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:5px 10px;font-size:13px;font-weight:700;z-index:4}
#legal a{color:inherit;text-decoration:underline}
#legal button{padding:2px 12px;font-size:13px;box-shadow:0 2px 0 var(--ink);flex:none}
.foot{margin-top:18px;font-size:13px;color:#cfe6f2;font-weight:600}
.foot a{color:#f6e7c1;text-decoration:underline}
#boot{position:fixed;inset:0;background:#031421;display:flex;align-items:center;justify-content:center;z-index:20}
#boot i{width:38px;height:38px;border:5px solid #ffffff33;border-top-color:#f6e7c1;border-radius:50%;animation:sp 1s linear infinite}
.toprow{display:flex;justify-content:flex-end;margin-bottom:6px}
button.sm{font-size:13px;padding:4px 10px;background:var(--paper2)}
@media(max-width:640px){button.btn{min-width:0;width:100%;max-width:340px}.grid{grid-template-columns:1fr}.pill{font-size:14px;padding:2px 8px}.bar{width:60px}.sign{font-size:20px}}
#toast{position:fixed;top:calc(104px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;background:var(--brass);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:5px 14px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 20px);text-align:center}
.log{margin:22px auto 0;max-width:920px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px;box-shadow:0 4px 0 var(--ink);font-weight:800}
.lg{display:inline-flex;margin:3px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px}.lg img{width:32px;height:32px}.lg.no img{filter:brightness(0) opacity(.35)}
.tag{color:#cfe6f2;font-weight:600;margin:10px auto 0;max-width:520px}
[hidden]{display:none!important}
.recv{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:520px;margin:6px auto}
.recv span{display:inline-flex;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px;animation:pop .3s both}
.recv img{width:26px;height:26px}

html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body.touch #sonar,body.touch #boost,body.touch #grab{position:fixed;right:calc(14px + env(safe-area-inset-right));min-width:84px;justify-content:center;padding:10px 12px;font-size:15px;z-index:3}
body.touch #grab{bottom:calc(14px + env(safe-area-inset-bottom))}
body.touch #boost{bottom:calc(72px + env(safe-area-inset-bottom))}
body.touch #sonar{bottom:calc(130px + env(safe-area-inset-bottom))}
body.touch .tools button.pill{padding:6px 10px}
body.touch .card button{padding:12px 14px}
body.touch button.sm{padding:8px 12px}
