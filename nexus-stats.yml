name: Pull Nexus Mods stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch download and endorsement counts
        run: node scripts/pull-nexus.js
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain mod-stats.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mod-stats.json
            git commit -m "Update Nexus Mods stats"
            git push
          fi
